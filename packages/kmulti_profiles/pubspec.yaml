name: kmulti_profiles
description: Native Android bridge exposing AndroidX WebKit multi-profile WebViews to Flutter.
version: 0.0.1
publish_to: "none"

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.kainuwa.kmultibrowser.profiles
        pluginClass: KMultiProfilesPlugin
